<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Võ Ngọc Cường — Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0d0f"/>
      <stop offset="1" stop-color="#1b1e22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3b341" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e3b341"/>
      <stop offset="1" stop-color="#e3b341" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#262a30" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#e3b341" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e3b341" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)" opacity="0.55"/>
    <rect width="1200" height="260" fill="url(#glow)"/>

    <!-- khối "kho": các cột tồn kho mọc lên -->
    <g transform="translate(860 70)" fill="#e3b341">
      <rect x="0" y="80" width="26" height="40" rx="4" opacity="0.35"><animate attributeName="height" values="0;40" dur="1.2s" fill="freeze"/><animate attributeName="y" values="120;80" dur="1.2s" fill="freeze"/></rect>
      <rect x="38" y="50" width="26" height="70" rx="4" opacity="0.5"><animate attributeName="height" values="0;70" dur="1.4s" fill="freeze"/><animate attributeName="y" values="120;50" dur="1.4s" fill="freeze"/></rect>
      <rect x="76" y="20" width="26" height="100" rx="4" opacity="0.75"><animate attributeName="height" values="0;100" dur="1.6s" fill="freeze"/><animate attributeName="y" values="120;20" dur="1.6s" fill="freeze"/></rect>
      <rect x="114" y="60" width="26" height="60" rx="4" opacity="0.45"><animate attributeName="height" values="0;60" dur="1.3s" fill="freeze"/><animate attributeName="y" values="120;60" dur="1.3s" fill="freeze"/></rect>
      <rect x="152" y="0" width="26" height="120" rx="4"><animate attributeName="height" values="0;120" dur="1.8s" fill="freeze"/><animate attributeName="y" values="120;0" dur="1.8s" fill="freeze"/></rect>
      <rect x="190" y="35" width="26" height="85" rx="4" opacity="0.6"><animate attributeName="height" values="0;85" dur="1.5s" fill="freeze"/><animate attributeName="y" values="120;35" dur="1.5s" fill="freeze"/></rect>
      <rect x="-10" y="128" width="246" height="2" fill="#5b626c"/>
    </g>

    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="72" y="78" fill="#e3b341" font-size="14" font-weight="600" letter-spacing="4">FRONTEND DEVELOPER · INTERNAL SYSTEMS · AUTOMATION</text>
      <text x="70" y="140" fill="#f3f4f6" font-size="56" font-weight="700">Võ Ngọc Cường</text>
      <text x="72" y="182" fill="#a3aab4" font-size="20">Xây hệ thống nội bộ và công cụ tự động hoá cho doanh nghiệp</text>
      <text x="72" y="214" fill="#5b626c" font-size="15" font-family="Consolas, 'SFMono-Regular', monospace">React · TypeScript · Tailwind · Python · Windows · AI có dẫn nguồn</text>
    </g>

    <!-- vạch quét vàng chạy ngang -->
    <rect y="252" width="320" height="2" fill="url(#gold)">
      <animate attributeName="x" values="-320;1200" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="18" fill="none" stroke="#262a30"/>
</svg>
